[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "skill-inspector"
version = "0.2.0"
description = "Parse, visualize, and audit SKILL.md agent instruction files as interactive DAGs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
skill-inspector = "skill_inspector.__main__:main"

[tool.pytest.ini_options]
testpaths = ["test"]
